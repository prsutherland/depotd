[package]
name = "depotd"
version = "0.1.0"
edition = "2024"
description = "Bare-bones S3-compatible object store daemon (buckets as dirs, objects as files)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/prsutherland/depotd"
readme = "README.md"
keywords = ["s3", "object-storage", "storage", "minio"]
categories = ["web-programming::http-server", "filesystem"]

include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE-*"]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util", "make"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
md5 = "0.7"
hex = "0.4"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
hyper = { version = "1.0", features = ["full"] }
futures = "0.3"
hmac = "0.12"
sha2 = "0.10"
url = "2.5"

[dev-dependencies]
tempfile = "3.10"
tokio-test = "0.4"
